<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@300;400;600;700;800&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#131011"/>

  <!-- Geometric accent shapes -->
  <!-- Large corner bracket TL -->
  <rect x="24" y="24" width="60" height="4" fill="#00b295"/>
  <rect x="24" y="24" width="4" height="60" fill="#00b295"/>
  <!-- Large corner bracket BR -->
  <rect x="716" y="422" width="60" height="4" fill="#C7E906"/>
  <rect x="772" y="366" width="4" height="60" fill="#C7E906"/>

  <!-- Background geometric lines (subtle) -->
  <line x1="400" y1="0" x2="400" y2="450" stroke="#1a1617" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#1a1617" stroke-width="1"/>

  <!-- Central content block -->
  <!-- Eyebrow -->
  <text x="400" y="130" font-family="Barlow, sans-serif" font-size="11" font-weight="700" fill="#00b295" text-anchor="middle" letter-spacing="4">AMHERSTBURG'S PREMIER DETAILING SERVICE</text>

  <!-- Big logotype -->
  <text x="400" y="220" font-family="Bebas Neue, sans-serif" font-size="100" fill="#ffffff" text-anchor="middle" letter-spacing="4">AUTO</text>
  <text x="400" y="310" font-family="Bebas Neue, sans-serif" font-size="100" fill="#C7E906" text-anchor="middle" letter-spacing="4">LAB</text>

  <!-- Tagline -->
  <text x="400" y="348" font-family="Barlow, sans-serif" font-size="13" font-weight="300" fill="#3a3637" text-anchor="middle" letter-spacing="3">DETAILING CO.</text>

  <!-- Divider lines flanking tagline -->
  <rect x="100" y="328" width="230" height="1" fill="#2a2526"/>
  <rect x="470" y="328" width="230" height="1" fill="#2a2526"/>

  <!-- CTA -->
  <rect x="300" y="368" width="200" height="44" rx="4" fill="#C7E906"/>
  <text x="400" y="395" font-family="Barlow, sans-serif" font-size="13" font-weight="800" fill="#131011" text-anchor="middle" letter-spacing="2">BOOK A DETAIL</text>

  <!-- Contact line -->
  <text x="400" y="432" font-family="Barlow, sans-serif" font-size="11" font-weight="400" fill="#2a2526" text-anchor="middle">(226) 340-5786  ·  autolab.detail.co@gmail.com</text>

  <!-- Small teal dot accents -->
  <circle cx="44" cy="225" r="3" fill="#00b295" opacity="0.5"/>
  <circle cx="756" cy="225" r="3" fill="#00b295" opacity="0.5"/>
  <circle cx="400" cy="44" r="3" fill="#C7E906" opacity="0.5"/>
  <circle cx="400" cy="406" r="3" fill="#C7E906" opacity="0.3"/>
</svg>
